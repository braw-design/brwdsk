name: Sincronizar con Discogs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: brwdsk
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar colección y portadas
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          DISCOGS_USER: brwdsk
        run: |
          npm install --no-audit --no-fund
          node scripts/sync.mjs
      - name: Guardar cambios
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "brwdsk-bot"
          git config user.email "brwdsk-bot@users.noreply.github.com"
          git add site data
          git diff --cached --quiet || git commit -m "Sincronización con Discogs"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
