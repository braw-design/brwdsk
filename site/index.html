<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brwdsk — vinyl collection</title>
<meta name="theme-color" content="#e8e8e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top"><span>brw<i>—</i>dsk</span><span>Vinyl collection</span><span>MX · 2026</span></div>
  <header id="hero">
    <h1>brw<span>dsk.</span></h1>
    <div class="hrow">
      <div class="tag2">Records<br>for the room</div>
      <button class="surprise" id="surprise"><span class="l">Sorpréndeme</span><span class="r">→</span></button>
    </div>
  </header>

  <div class="label slabel">Escucha por momento</div>
  <div class="shelf" id="shelf"></div>

  <div class="stick" id="stick">
  <div class="mini">
    <button class="mlogo" id="mlogo" aria-label="Volver al inicio">brw<span>dsk.</span></button>
    <button class="msur" id="msur"><span class="l">Sorpréndeme</span><span class="r">→</span></button>
  </div>
  <div class="srow">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Artista, álbum, canción o año…" autocomplete="off">
  </div>
  <button class="fbtn" id="fbtn" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    Filtros<span class="badge" id="badge"></span>
  </button>
  </div>
  <div class="fpanel" id="fpanel"><div class="fin">

  <div class="label">Sesiones</div>
  <div class="row" id="sessions"></div>
  <div class="label">Género</div>
  <div class="row" id="genres"></div>
  <button class="more" id="more"><i>+</i> Más filtros</button>
  <div class="adv" id="adv"></div>
  <button class="clear" id="clear">Limpiar filtros</button>
  </div></div>
  </div>

  <div class="bar">
    <span><span id="count"></span><button class="clearsm" id="clear2">· Limpiar</button></span>
    <select id="sort">
      <option value="artist">Artista A–Z</option>
      <option value="title">Álbum A–Z</option>
      <option value="yearAsc">Año ↑</option>
      <option value="yearDesc">Año ↓</option>
      <option value="added">Recién agregados</option>
      <option value="rare" id="rareopt" hidden>Más raros primero</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
  <footer class="foot"><span>brwdsk · music in the house · 2026</span><a href="https://www.instagram.com/brawllio/" target="_blank" rel="noopener">by braw design ↗</a></footer>
</div>

<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script src="app.js"></script>
</body>
</html>
